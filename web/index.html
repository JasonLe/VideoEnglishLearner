<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vel · VideoEnglishLearner</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" title="VideoEnglishLearner"><span>v</span>el</div>
    <form id="add-form" class="add-form" autocomplete="off">
      <input id="url-input" type="text" placeholder="粘贴 YouTube 链接，回车添加…" />
      <select id="add-mode" title="添加模式：只取字幕最快，只取视频不下载字幕">
        <option value="video+subs">视频 + 字幕</option>
        <option value="subs-only">只取字幕</option>
        <option value="video-only">只取视频</option>
      </select>
      <button type="submit">添加</button>
    </form>
    <div id="health" class="health"></div>
    <div id="task-bar" class="task-bar hidden"></div>
    <nav class="topbar-nav">
      <button id="nav-library" class="ghost topbar-btn on" type="button">视频库</button>
      <button id="nav-vocab" class="ghost topbar-btn" type="button">生词本<span id="vocab-badge" class="nav-badge hidden">0</span></button>
    </nav>
    <button id="settings-btn" class="ghost topbar-btn" type="button">设置</button>
  </header>

  <main>
    <div id="env-warn" class="env-warn" hidden></div>

    <!-- 库 -->
    <section id="library-view" class="view">
      <div id="empty-hint" class="empty-hint">
        <h2>还没有视频</h2>
        <p>把 YouTube 链接粘到上面的输入框。下载 + 字幕解析 + 切分一条龙，完成后点进去就能精听。</p>
        <p class="dim">第一次用请先在 config.toml 里配好 <code>[network] proxy</code>（国内访问 YouTube 必须走代理）。</p>
      </div>
      <div id="video-list" class="video-list"></div>
    </section>

    <!-- 生词本 -->
    <section id="vocab-view" class="view hidden">
      <div class="vocab-head">
        <h2>生词本</h2>
        <span class="spacer"></span>
        <span id="vocab-total" class="dim small"></span>
        <button id="review-start" type="button">开始复习</button>
      </div>
      <div id="vocab-stats" class="vocab-stats"></div>
      <div class="vocab-toolbar">
        <div id="vocab-tabs" class="vocab-tabs"></div>
        <div class="vocab-filters">
          <input id="vocab-q" type="search" placeholder="搜索单词 / 释义…" autocomplete="off" />
          <select id="vocab-tag" title="按考试 tag 过滤">
            <option value="">全部 tag</option>
          </select>
          <select id="vocab-sort" title="排序">
            <option value="recent">最近添加</option>
            <option value="due">按到期</option>
            <option value="alpha">字母顺序</option>
          </select>
          <span class="vocab-export" title="导出（TSV 可直接导入 Anki）">
            <button class="ghost small" type="button" data-export="tsv">Anki TSV</button>
            <button class="ghost small" type="button" data-export="csv">CSV</button>
            <button class="ghost small" type="button" data-export="json">JSON</button>
          </span>
        </div>
      </div>
      <div id="vocab-list" class="vocab-list"></div>
      <div id="vocab-more" class="vocab-more hidden">
        <button class="ghost" type="button">加载更多</button>
      </div>
    </section>

    <!-- 播放器 -->
    <section id="player-view" class="view hidden">
      <div class="player-head">
        <button id="back-btn" class="ghost" type="button">← 返回</button>
        <div class="player-meta">
          <h1 id="video-title"></h1>
          <div id="video-sub" class="dim"></div>
          <div id="player-actions" class="player-actions" hidden>
            <a id="dl-video" class="icon-btn" href="#" download>下载视频</a>
            <a id="dl-subs" class="icon-btn" href="#" download>下载字幕</a>
          </div>
        </div>
      </div>

      <div class="player-grid">
        <div class="stage">
          <div class="video-wrap">
            <video id="video" controls playsinline preload="metadata"></video>
          </div>
          <div id="now-line" class="now-line"></div>
          <div id="ab-badge" class="ab-badge" hidden></div>
          <div id="analysis-panel" class="analysis-panel"></div>
          <div class="hint-row">
            <span><kbd>空格</kbd> 播放</span>
            <span><kbd>←</kbd><kbd>→</kbd> ±3s</span>
            <span><kbd>↑</kbd><kbd>↓</kbd> 上/下一句</span>
            <span><kbd>Enter</kbd> 复读</span>
            <span><kbd>A</kbd>/<kbd>B</kbd> AB 循环</span>
            <span><kbd>S</kbd> 0.75×</span>
            <span><kbd>N</kbd> 精听模式</span>
            <span><kbd>Esc</kbd> 退出 AB / 复读 / 慢速</span>
            <span class="dim">字幕点词 = 查词卡</span>
          </div>
        </div>

        <aside class="subs-panel">
          <div class="panel-head">
            <span id="subs-count" class="dim">字幕</span>
            <label class="toggle"><input type="checkbox" id="auto-scroll" checked /> 跟随</label>
            <button id="analyze-btn" class="ghost small" type="button">解析</button>
          </div>
          <div class="panel-tools">
            <label class="dim small" for="subs-mode">精听</label>
            <select id="subs-mode">
              <option value="bilingual">双语</option>
              <option value="en-only">只听英文（遮住中文）</option>
              <option value="write">遮住英文（听写）</option>
            </select>
          </div>
          <div id="subtitle-list" class="subtitle-list"></div>
        </aside>
      </div>
    </section>

    <!-- 设置 -->
    <section id="settings-view" class="view hidden">
      <div class="settings-head">
        <button id="settings-back" class="ghost" type="button">← 返回</button>
        <h2>设置</h2>
        <span id="settings-file" class="dim small mono"></span>
      </div>

      <div id="ffmpeg-status" class="ffmpeg-status"></div>

      <div id="settings-body" class="settings-body"></div>

      <div class="settings-actions">
        <button id="settings-save" type="button">保存并生效</button>
        <button id="settings-reset" class="ghost" type="button">恢复默认值</button>
        <span class="dim small">监听地址 / 端口改了要重启服务；其它项保存后对下一个任务生效</span>
      </div>
    </section>
  </main>

  <!-- 查词弹层：遮罩单独一层，点遮罩关闭；弹层本体在窄屏变底部 sheet -->
  <div id="popover-overlay" class="popover-overlay hidden"></div>
  <div id="word-popover" class="word-popover hidden" role="dialog" aria-label="查词卡"></div>

  <!-- 生词复习卡片 -->
  <div id="review-modal" class="review-modal hidden" role="dialog" aria-modal="true" aria-label="生词复习"></div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
